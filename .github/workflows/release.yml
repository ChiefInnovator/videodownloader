name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "v${MANIFEST_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Package extension and companion
        id: pkg
        run: |
          mapfile -t ZIPS < <(bash scripts/package.sh)
          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "companion=${ZIPS[1]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Install steps go first; GitHub's generated changelog is appended.
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.zip }}" "${{ steps.pkg.outputs.companion }}" \
            --title "Video Downloader ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
