name: Regression tests
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Chrome API contract and parser regressions
        run: node --experimental-vm-modules --test --test-timeout=10000 tests/*.test.mjs
      - name: JavaScript syntax
        run: |
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file" || exit 1
          done
